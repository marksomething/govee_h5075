[package]
name = "govee5075"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Read Govee H5075 temperature/humidity sensors over Bluetooth"
license = "MIT"

[dependencies]
btleplug = "0.11"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
uuid = "1"

[[bin]]
name = "govee5075"
path = "src/main.rs"

[profile.release]
lto = true
strip = "symbols"
