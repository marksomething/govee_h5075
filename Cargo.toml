[package]
name = "govee5075"
version = "0.1.0"
edition = "2021"
description = "Read Govee H5075 temperature/humidity sensors over Bluetooth"
license = "MIT"

[dependencies]
btleplug = "0.11"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }

[[bin]]
name = "govee5075"
path = "src/main.rs"

[profile.release]
lto = true
